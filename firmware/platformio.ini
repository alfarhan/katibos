[common]
default_envs = microjournal
platform = espressif32@7.0.1
framework = arduino

[platformio]
boards_dir = boards

; Everything the rev_8 envs share. The panel profile is deliberately NOT here -
; see the note on [env:microjournal_type2].
[flags]
base =
  ; Configuration
  -D REV8
  -D KEYPAD_68
  -D BOARD_ESP32_S3
  -D BOARD_NAME=\"MicroJournal\"
  -D KATIBOS_UPDATE_URL=\"https://raw.githubusercontent.com/alfarhan/katibos/main/firmware/latest.json\"
  -D USE_MSC ; mass storage
  -D USE_FAT
  -D FIRMWARE=\"/firmware_microjournal.bin\"

  ; DISPLAY
  -D PIN_SCLK=12
  -D PIN_MOSI=11
  -D PIN_CS=10
  -D PIN_DC=46
  -D PIN_RST=3

  ; ESP32 S3
  -D BOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_CACHE_WORKAROUND
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw

; ------------------------------------------
; MICRO JOURNAL REVISION 8
; ST7306 300x400 reflective LCD
; YDP420H001-V3
; ------------------------------------------
[env:microjournal]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_opi
board_build.arduino_psram = enabled
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 4128768
board_build.filesystem = fatfs
board_build.partitions = partition_esp32s3_rev8_16mb.csv
upload_speed =  921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

lib_deps =
  ArduinoJson
  https://github.com/adafruit/Adafruit_Keypad
  https://github.com/h2zero/NimBLE-Arduino.git

build_src_filter =
  -<*>
  +<main.cpp>
  +<app/*>
  ;
  +<display/display.*>
  +<display/RLCD/*>
  ;
  +<keyboard/keyboard.*>
  +<keyboard/Keypad/Keypad.*>
  +<keyboard/Keypad/68/*>
  +<keyboard/Locale/*>
  +<keyboard/BLEHost/*>
  ;
  +<service/Tools/*>
  +<service/Editor/*>
  +<service/Bidi/*>
  +<service/Updater/*>
  +<service/WifiEntry/*>
  +<service/Buffer/*>
  +<service/Sync/*>
  +<service/Ai/*>
  +<service/Net/*>
  +<service/Idle/*>
  +<service/WordCounter/*>
  +<service/MassStorage/*>
  +<service/Battery/*>

lib_ignore =
  FatFSUSB
  EPD
  EspUsbHost
  USBHIDBoot

build_flags =
  ${flags.base}

  ; PANEL PROFILE. The rev_8 glass is a YDP420H001-V3: 300x400 dots, ST7306,
  ; normally-white reflective - the driver's *type 1* profile. Set it here
  ; explicitly: the library header defaults RLCD_TYPE to 2, which describes a
  ; different supplier's panel (400x300, 1bpp packing, a different column
  ; window), and under it the frame lands on part of the glass only. The band
  ; it never addresses keeps whatever was there, which reads as a ghost that
  ; survives a reboot, a reflash and even a full chip erase.
  -D RLCD_TYPE=1


; The other supplier's panel. Every env restates ${flags.base} and picks the
; profile itself rather than one extending the other's flags: PlatformIO
; reorders and de-duplicates build_flags, so a trailing -D (or -U) cannot be
; relied on to override an inherited one - it just warns "RLCD_TYPE redefined"
; and leaves the winner up to flag order.
[env:microjournal_type2]
extends = env:microjournal
build_flags =
  ${flags.base}
  -D RLCD_TYPE=2


; ------------------------------------------
; WAVESHARE ESP32-S3-RLCD-4.2
; Same ST7305 300x400 panel as rev_8, different wiring.
; No matrix keypad -> type over USB serial (USE_SERIAL_KEYBOARD),
; and connect a BLE keyboard as a HID host (USE_BLE_KEYBOARD_HOST).
; ------------------------------------------
[env:waveshare]
extends = env:microjournal
build_flags =
  ; Configuration
  -D REV8
  -D KEYPAD_68
  -D BOARD_ESP32_S3
  -D BOARD_NAME=\"Waveshare\"
  -D KATIBOS_UPDATE_URL=\"https://raw.githubusercontent.com/alfarhan/katibos/main/firmware/latest_waveshare.json\"
  -D USE_MSC
  -D USE_FAT
  -D FIRMWARE=\"/firmware_waveshare.bin\"

  ; No physical keypad on this board — accept keystrokes over USB serial
  -D USE_SERIAL_KEYBOARD

  ; ...and over Bluetooth: connect to a BLE keyboard as a HID host
  -D USE_BLE_KEYBOARD_HOST

  ; 18650 sensed on GPIO4 (ADC1_CH3) behind a 3x divider. rev_8 has no
  ; equivalent sense line, so it stays off there.
  -D BATTERY
  -D BATTERY_ADC_PIN=4
  -D BATTERY_DIVIDER=3.0f

  ; Route Serial (typing + logs) to the ESP32-S3 native USB on the Type-C port
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

  ; DISPLAY — Waveshare ESP32-S3-RLCD-4.2 pinout (ST7305)
  -D PIN_SCLK=11
  -D PIN_MOSI=12
  -D PIN_CS=40
  -D PIN_DC=5
  -D PIN_RST=41

  ; PANEL PROFILE. This board's glass is the 400x300 1bpp variant - the
  ; library's default. Stated anyway, for the same reason rev_8 states its own.
  -D RLCD_TYPE=2

  ; ESP32 S3
  -D BOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_CACHE_WORKAROUND
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
